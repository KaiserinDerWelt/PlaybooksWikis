<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" role="img" aria-label="Attachment triage">
<title>Attachment triage</title>
<style>text{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2933}.box{fill:#eef2f7;stroke:#52606d;stroke-width:1.2}.arrow{stroke:#52606d;stroke-width:1.5;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52606d"/></marker></defs>
<text x="20" y="26" style="font-weight:600">Attachment triage</text>
<rect class="box" x="20" y="40" width="600" height="44" rx="6"/>
<text x="36" y="67">1. Record file name and SHA-256 hash</text>
<line class="arrow" x1="320" y1="84" x2="320" y2="104"/>
<rect class="box" x="20" y="106" width="600" height="44" rx="6"/>
<text x="36" y="133">2. Check EDR: did any recipient open it?</text>
<line class="arrow" x1="320" y1="150" x2="320" y2="170"/>
<rect class="box" x="20" y="172" width="600" height="44" rx="6"/>
<text x="36" y="199">3. Child process ran: isolate host</text>
<line class="arrow" x1="320" y1="216" x2="320" y2="236"/>
<rect class="box" x="20" y="238" width="600" height="44" rx="6"/>
<text x="36" y="265">4. Purge message and block hash</text>
<line class="arrow" x1="320" y1="282" x2="320" y2="302"/>
<rect class="box" x="20" y="304" width="600" height="44" rx="6"/>
<text x="36" y="331">5. Second stage found: malware playbook</text>
</svg>
